<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="iSky" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#7ec8ff"/>
      <stop offset="65%" stop-color="#3a8fd6"/>
      <stop offset="100%" stop-color="#1a5a9c"/>
    </radialGradient>
    <radialGradient id="iBurst" cx="42%" cy="50%" r="40%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#bcdcff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bcdcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iGold" x1="0%" y1="40%" x2="0%" y2="100%">
