<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bgGlow" cx="22%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#1a0800"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="textGlow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGlow)"/>
  <rect width="1200" height="400" fill="#000000" opacity="0.25"/>

  <!-- Radar rings -->
  <circle cx="200" cy="200" r="55"  fill="none" stroke="#FF6B00" stroke-width="0.7" stroke-opacity="0.12"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#FF6B00" stroke-width="0.7" stroke-opacity="0.09"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#FF6B00" stroke-width="0.7" stroke-opacity="0.07"/>
  <circle cx="200" cy="200" r="200" fill="none" stroke="#FF6B00" stroke-width="0.7" stroke-opacity="0.05"/>
  <line x1="200" y1="0"   x2="200" y2="400" stroke="#FF6B00" stroke-width="0.5" stroke-opacity="0.05"/>
  <line x1="0"   y1="200" x2="500" y2="200" stroke="#FF6B00" stroke-width="0.5" stroke-opacity="0.05"/>

  <!-- UFO LOGO — centred at 200,200, scaled 1.1x -->
  <g transform="translate(68, 68) scale(1.1)">
    <!-- Orbit ring -->
    <ellipse cx="120" cy="120" rx="104" ry="28" stroke="#FF6B00" stroke-width="1.4" fill="none" stroke-opacity="0.45"/>
    <!-- Saucer body -->
    <ellipse cx="120" cy="124" rx="60" ry="20" fill="#1a0800" stroke="#FF6B00" stroke-width="2" filter="url(#logoGlow)"/>
    <!-- Dome -->
    <path d="M84 124 Q84 88 120 84 Q156 88 156 124" fill="#0f0500" stroke="#FF6B00" stroke-width="2" filter="url(#logoGlow)"/>
    <!-- Dome highlight -->
    <path d="M96 116 Q100 96 120 92 Q140 96 144 116" fill="none" stroke="#FF9A3C" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Underside lines -->
    <line x1="88"  y1="130" x2="88"  y2="136" stroke="#FF6B00" stroke-width="1.4" stroke-opacity="0.7"/>
    <line x1="104" y1="134" x2="104" y2="141" stroke="#FF6B00" stroke-width="1.4" stroke-opacity="0.7"/>
    <line x1="120" y1="136" x2="120" y2="143" stroke="#FF6B00" stroke-width="1.4" stroke-opacity="0.7"/>
    <line x1="136" y1="134" x2="136" y2="141" stroke="#FF6B00" stroke-width="1.4" stroke-opacity="0.7"/>
    <line x1="152" y1="130" x2="152" y2="136" stroke="#FF6B00" stroke-width="1.4" stroke-opacity="0.7"/>
    <!-- Tractor beam -->
    <path d="M100 144 L84 180 L156 180 L140 144" fill="#FF6B00" fill-opacity="0.05"/>
    <!-- Eye left -->
    <ellipse cx="102" cy="108" rx="9" ry="12" fill="#000" stroke="#FF6B00" stroke-width="1.4" filter="url(#logoGlow)"/>
    <ellipse cx="102" cy="108" rx="4" ry="6"  fill="#FF6B00" fill-opacity="0.95"/>
    <!-- Eye right -->
    <ellipse cx="138" cy="108" rx="9" ry="12" fill="#000" stroke="#FF6B00" stroke-width="1.4" filter="url(#logoGlow)"/>
    <ellipse cx="138" cy="108" rx="4" ry="6"  fill="#FF6B00" fill-opacity="0.95"/>
    <!-- Orbiting dots -->
    <circle cx="120" cy="16"  r="3.5" fill="#FF6B00" filter="url(#subtleGlow)"/>
    <circle cx="224" cy="120" r="3.5" fill="#FF9A3C" filter="url(#subtleGlow)"/>
    <circle cx="120" cy="224" r="3.5" fill="#FF6B00" filter="url(#subtleGlow)"/>
    <circle cx="16"  cy="120" r="3.5" fill="#FF9A3C" filter="url(#subtleGlow)"/>
  </g>

  <!-- Vertical divider -->
  <line x1="400" y1="50" x2="400" y2="350" stroke="#FF6B00" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- === TEXT — starts at x=440, max width ~720px === -->

  <!-- Main title: font-size 58, letter-spacing 3 -->
  <!-- "ALIENS ARE REAL" ~15 chars × ~38px = ~570px — fits in 720px -->
  <text
    x="440" y="188"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="58"
    font-weight="900"
    letter-spacing="4"
    fill="#FF6B00"
    filter="url(#textGlow)"
  >UAPscan</text>

  <!-- Dotted underline -->
  <line x1="440" y1="204" x2="1160" y2="204" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 7"/>

  <!-- Tagline: "GLOBAL ET INTELLIGENCE NETWORK" ~30 chars × ~14px = ~420px — fits -->
  <text
    x="442" y="244"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="19"
    font-weight="400"
    letter-spacing="6"
    fill="#FF9A3C"
    opacity="0.85"
  >GLOBAL ET INTELLIGENCE NETWORK</text>

  <!-- Ticker badge -->
  <rect x="442" y="272" width="160" height="36" rx="4" fill="#FF6B00" fill-opacity="0.1" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.5"/>
  <text
    x="522" y="296"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="17"
    font-weight="700"
    letter-spacing="2"
    fill="#FF6B00"
    text-anchor="middle"
    filter="url(#subtleGlow)"
  >$UAPSCAN</text>

  <!-- Corner brackets -->
  <path d="M18 18 L18 52 M18 18 L52 18" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M1182 18 L1182 52 M1182 18 L1148 18" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M18 382 L18 348 M18 382 L52 382" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M1182 382 L1182 348 M1182 382 L1148 382" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
</svg>
