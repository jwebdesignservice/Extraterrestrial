<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Orbit ring -->
  <ellipse cx="60" cy="60" rx="52" ry="14" stroke="#FF6B00" stroke-width="1.2" fill="none" stroke-opacity="0.5"/>

  <!-- UFO saucer body -->
  <ellipse cx="60" cy="62" rx="30" ry="10" fill="#1a0a00" stroke="#FF6B00" stroke-width="1.8" filter="url(#glow)"/>

  <!-- UFO dome -->
  <path d="M42 62 Q42 44 60 42 Q78 44 78 62" fill="#0f0600" stroke="#FF6B00" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Dome highlight -->
  <path d="M48 58 Q50 48 60 46 Q70 48 72 58" fill="none" stroke="#FF9A3C" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- UFO underside beam lines -->
  <line x1="44" y1="65" x2="44" y2="68" stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="52" y1="67" x2="52" y2="71" stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="60" y1="68" x2="60" y2="72" stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="68" y1="67" x2="68" y2="71" stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="76" y1="65" x2="76" y2="68" stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Tractor beam glow -->
  <path d="M50 72 L42 90 L78 90 L70 72" fill="#FF6B00" fill-opacity="0.06"/>

  <!-- Alien eye left -->
  <ellipse cx="51" cy="54" rx="4.5" ry="6" fill="#000" stroke="#FF6B00" stroke-width="1.2" filter="url(#glow)"/>
  <ellipse cx="51" cy="54" rx="2" ry="3" fill="#FF6B00" fill-opacity="0.95"/>

  <!-- Alien eye right -->
  <ellipse cx="69" cy="54" rx="4.5" ry="6" fill="#000" stroke="#FF6B00" stroke-width="1.2" filter="url(#glow)"/>
  <ellipse cx="69" cy="54" rx="2" ry="3" fill="#FF6B00" fill-opacity="0.95"/>

  <!-- Orbiting dots -->
  <circle cx="60" cy="8" r="2.5" fill="#FF6B00" filter="url(#glow)"/>
  <circle cx="112" cy="60" r="2.5" fill="#FF9A3C" filter="url(#glow)"/>
  <circle cx="60" cy="112" r="2.5" fill="#FF6B00" filter="url(#glow)"/>
  <circle cx="8" cy="60" r="2.5" fill="#FF9A3C" filter="url(#glow)"/>
</svg>
